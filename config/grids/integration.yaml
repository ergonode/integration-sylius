sylius_grid:
    grids:
        bitbag_ergonode_admin_integration:
            driver:
                name: doctrine/orm
                options:
                    class: "%bitbag_ergonode.model.integration.class%"
            limits: [10, 25, 50]
            fields:
                name:
                    type: twig
                    label: sylius.ui.name
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/name.html.twig"
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                        vars:
                            th_class: "w-1 text-center"
                            td_class: "text-center"
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [name]
                enabled:
                    type: boolean
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
