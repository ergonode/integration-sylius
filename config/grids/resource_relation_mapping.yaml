sylius_grid:
    templates:
        action:
            create_resource_relation_mapping: "@BitBagSyliusErgonodePlugin/admin/resource_relation_mapping/grid/action/create.html.twig"
    grids:
        bitbag_ergonode_admin_resource_relation_mapping:
            driver:
                name: doctrine/orm
                options:
                    class: "%bitbag_ergonode.model.resource_relation_mapping.class%"
            limits: [10, 25, 50]
            fields:
                relation_type:
                    type: twig
                    label: bitbag_ergonode.ui.relation_type
                    sortable: ~
                    options:
                        template: "@BitBagSyliusErgonodePlugin/admin/resource_relation_mapping/grid/field/type.html.twig"
                ergonode_value:
                    type: string
                    label: bitbag_ergonode.ui.ergonode_value
                sylius_value:
                    type: string
                    label: bitbag_ergonode.ui.sylius_value
                integration:
                    type: twig
                    label: bitbag_ergonode.ui.integration
                    sortable: ~
                    options:
                        template: "@BitBagSyliusErgonodePlugin/admin/resource_relation_mapping/grid/field/integration.html.twig"
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ergonodeValue, syliusValue]
                relationType:
                    type: select
                    label: bitbag_ergonode.ui.relation_type
                    form_options:
                        choices:
                            'bitbag_ergonode.ui.relation_types.attribute_property': 'attribute_property'
                            'bitbag_ergonode.ui.relation_types.category_property': 'category_property'
                            'bitbag_ergonode.ui.relation_types.variant_property': 'variant_property'
                            'bitbag_ergonode.ui.relation_types.product_property': 'product_property'
                            'bitbag_ergonode.ui.relation_types.attribute_external_identifier': 'attribute_external_identifier'
                            'bitbag_ergonode.ui.relation_types.category_external_identifier': 'category_external_identifier'
                            'bitbag_ergonode.ui.relation_types.variant_external_identifier': 'variant_external_identifier'
                            'bitbag_ergonode.ui.relation_types.product_external_identifier': 'product_external_identifier'
                            'bitbag_ergonode.ui.relation_types.locale_external_identifier': 'locale_external_identifier'

                integration:
                    type: entity
                    label: bitbag_ergonode.ui.integration
                    form_options:
                        class: "%bitbag_ergonode.model.integration.class%"
                        choice_label: 'name'
            actions:
                main:
                    create:
                        type: create_resource_relation_mapping
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
