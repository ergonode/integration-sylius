monolog:
    channels:
        - ergonode
    handlers:
        ergonode_general:
            type: stream
            path: "%kernel.logs_dir%/sylius_ergonode_%kernel.environment%.log"
            level: debug
            channels: ["!event"]
        ergonode_error:
            type: stream
            path: "%kernel.logs_dir%/sylius_ergonode_error_%kernel.environment%.log"
            level: warning
            channels: [ "app", "doctrine", "ergonode" ]
