# @see https://github.com/Sylius/SyliusResourceBundle/blob/master/docs/index.md
sylius_resource:
    # Override default settings
    #settings:

    # Configure the mapping for your resources
    mapping:
        paths:
            - '%kernel.project_dir%/src/Entity'

    # Configure your resources
    resources:
        bitbag_ergonode.integration:
            classes:
                model: BitBag\SyliusErgonodePlugin\Entity\Integration
                form: BitBag\SyliusErgonodePlugin\Form\Type\IntegrationType
        bitbag_ergonode.resource_relation_mapping:
            classes:
                model: BitBag\SyliusErgonodePlugin\Entity\ResourceRelationMapping
                form: BitBag\SyliusErgonodePlugin\Form\Type\ResourceRelationMappingType
                factory: BitBag\SyliusErgonodePlugin\Factory\ResourceRelationMappingFactory
