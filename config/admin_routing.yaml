bitbag_ergonode_integration:
    resource: |
        alias: bitbag_ergonode.integration
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        redirect: index
        except: ['show']
        grid: bitbag_ergonode_admin_integration
    type: sylius.resource

bitbag_ergonode_resource_relation_mapping:
    resource: |
        alias: bitbag_ergonode.resource_relation_mapping
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['create', 'show']
        redirect: index
        grid: bitbag_ergonode_admin_resource_relation_mapping
    type: sylius.resource

bitbag_ergonode_admin_resource_relation_mapping_create:
    path: /resource-relation-mapping/{type}/new
    methods: [GET, POST]
    defaults:
        _controller: bitbag_ergonode.controller.resource_relation_mapping::createAction
        _sylius:
            section: admin
            factory:
                method: createTyped
                arguments:
                    type: $type
            form:
                type: BitBag\SyliusErgonodePlugin\Form\Type\ResourceRelationMappingType
            template: "@SyliusAdmin/shared/crud/create.html.twig"
            redirect: bitbag_ergonode_admin_resource_relation_mapping_index
            permission: true
            vars:
                route:
                    parameters:
                        type: $type

bitbag_ergonode_admin_integration_synchronization:
    path: /integration/{id}/sychronization
    methods: [POST]
    defaults:
        _controller: bitbag.sylius_ergonode_plugin.controller.synchronization_action

bitbag_ergonode_admin_integration_full_synchronization:
    path: /integration/{id}/full-sychronization
    methods: [POST]
    defaults:
        _controller: bitbag.sylius_ergonode_plugin.controller.synchronization_action
